name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'plugins/**'
      - 'presets/**'
      - 'requirements.txt'
      - '.github/workflows/build-windows-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name StrategyResearchLab --add-data "plugins;plugins" --add-data "presets;presets" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: StrategyResearchLab-Windows
          path: dist/StrategyResearchLab.exe
